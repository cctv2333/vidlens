name: release

# Tag a commit `v*` to publish to PyPI and attach the artifacts to a GitHub Release.
#
# Auth is PyPI Trusted Publishing (OIDC) — there is no API token and no secret to
# rotate. One-time setup, already done for this project:
#   https://pypi.org/manage/project/vidlens-mcp/settings/publishing/
#     Owner / Repository : cctv2333 / vidlens
#     Workflow filename  : release.yml
#     Environment name   : pypi
# If a publish ever fails with "trusted publisher" in the message, that
# registration drifted — re-add it there rather than reintroducing a token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: build
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vidlens-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing (OIDC): no long-lived token. Requires a publisher on
        # https://pypi.org/manage/project/vidlens-mcp/settings/publishing/ with
        # owner=cctv2333, repo=vidlens, workflow=release.yml, environment=pypi.
        with:
          print-hash: true

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
